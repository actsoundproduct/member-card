<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員証</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="app.js"></script>
</head>
<body>
<div class="wrap">
  <h1 id="shop"></h1>
  <p class="lead">会員証</p>

  <p id="loading" class="lead">読み込み中です…</p>

  <!-- 会員証 -->
  <div id="card" class="hidden">
    <div class="card">
      <p class="name" id="name"></p>
      <svg id="bar" role="img" aria-label="会員バーコード"></svg>
      <p class="code" id="code"></p>
    </div>
    <p class="hint">レジで、この画面をバーコードリーダーにかざしてください。</p>
  </div>

  <!-- まだ登録していない -->
  <div id="none" class="hidden">
    <div class="card">
      <p class="name">まだ会員登録がありません</p>
      <p class="lead" style="margin:0">お店のスタッフにお声がけください。登録用のQRコードをご案内します。</p>
    </div>
  </div>

  <p id="error" class="error"></p>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $('shop').textContent = App.config.shopName;
  App.init()
    .then(function () { return App.api('getCard'); })
    .then(function (r) {
      $('loading').classList.add('hidden');
      if (!r.ok) { $('error').textContent = r.message || 'うまく開けませんでした。'; return; }
      if (!r.registered) { $('none').classList.remove('hidden'); return; }
      $('name').textContent = r.name + ' 様';
      $('code').textContent = r.code;
      App.drawBarcode($('bar'), r.code);
      $('card').classList.remove('hidden');
    })
    .catch(function () {
      $('loading').classList.add('hidden');
      $('error').textContent = '通信できませんでした。電波の良い場所で、もう一度開いてください。';
    });
})();
</script>
</body>
</html>
