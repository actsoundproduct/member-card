<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員登録</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="app.js"></script>
</head>
<body>
<div class="wrap">
  <h1 id="shop"></h1>
  <p class="lead">会員登録</p>

  <form id="form" novalidate>
    <div class="row">
      <div><label for="sei">姓</label><input id="sei" type="text" autocomplete="family-name" maxlength="20" required></div>
      <div><label for="mei">名</label><input id="mei" type="text" autocomplete="given-name" maxlength="20" required></div>
    </div>
    <div>
      <label for="phone">電話番号</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09012345678" maxlength="13" required>
    </div>
    <div class="consent">
      <div id="privacy"></div>
      <label><input id="consent" type="checkbox"> 上記に同意します</label>
    </div>
    <p id="error" class="error" role="alert"></p>
    <button id="submit" type="submit">登録して会員証を表示</button>
  </form>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $('shop').textContent = App.config.shopName;
  $('privacy').textContent = App.config.privacyText;
  var ready = App.init();

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var sei = $('sei').value.trim(), mei = $('mei').value.trim();
    var phone = $('phone').value.replace(/[０-９]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    }).replace(/[^0-9]/g, '');
    if (!sei || !mei) { $('error').textContent = 'お名前（姓・名）を入力してください。'; return; }
    if (!/^0\d{9,10}$/.test(phone)) { $('error').textContent = '電話番号をご確認ください（例：09012345678）。'; return; }
    if (!$('consent').checked) { $('error').textContent = '同意にチェックを入れてください。'; return; }

    $('error').textContent = '';
    $('submit').disabled = true;
    $('submit').textContent = '登録しています…';
    ready.then(function () {
      return App.api('register', { sei: sei, mei: mei, phone: phone, consent: true });
    }).then(function (r) {
      if (!r.ok) throw new Error(r.message || '登録できませんでした。');
      location.href = 'index.html' + location.search;   // 会員証へ
    }).catch(function (e) {
      $('error').textContent = e.message || '通信できませんでした。もう一度お試しください。';
      $('submit').disabled = false;
      $('submit').textContent = '登録して会員証を表示';
    });
  });
})();
</script>
</body>
</html>
